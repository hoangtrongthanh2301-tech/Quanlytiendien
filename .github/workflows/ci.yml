name: Build and validate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build --tag quanlytiendien:test .

      - name: Check PHP syntax in application files
        run: |
          docker run --rm quanlytiendien:test sh -lc \
            "find . -maxdepth 2 -type f -name '*.php' -print0 | xargs -0 -n1 php -l"
